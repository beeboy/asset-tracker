name: collect
# Yahoo Finance 시세를 받아 data/ 에 저장하고 커밋한다. GitHub Pages 화면이 이 파일을 읽는다.
on:
  schedule:
    - cron: "*/30 8-23 * * 1-5"   # 미국 프리마켓~애프터마켓 (UTC), 30분마다
    - cron: "15 0 * * 2-6"        # 애프터마켓 마감 직후
  workflow_dispatch:
    inputs:
      add_tickers:
        description: "수집 목록에 더할 티커 (쉼표 구분, 예: AAPL,005930.KS). 비워도 됨"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시세 수집
        env:
          ADD: ${{ github.event.inputs.add_tickers }}
        run: python server.py --collect --add "$ADD"
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "시세 수집 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
