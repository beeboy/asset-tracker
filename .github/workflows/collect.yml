name: collect
# Yahoo Finance 시세를 받아 data/ 에 저장하고 커밋한다. GitHub Pages 화면이 이 파일을 읽는다.
on:
  schedule:
    - cron: "*/30 8-23 * * 1-5"   # 미국 프리마켓~애프터마켓 (UTC), 30분마다
    - cron: "15 0 * * 2-6"        # 애프터마켓 마감 직후
  workflow_dispatch:
    inputs:
      add_tickers:
        description: "수집 목록에 더할 티커 (쉼표 구분, 예: AAPL,005930.KS). 비워도 됨"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 시세 수집
        env:
          ADD: ${{ github.event.inputs.add_tickers }}
        run: python server.py --collect --add "$ADD"
      - name: 아이폰 위젯용 작은 시세 파일
        run: python tools/widget_feed.py
      # news.yml 의 한 시간 예약은 GitHub 가 몇 시간씩 미루므로, 시세 수집 때 뉴스가 50분 넘게 묵었으면 같이 모은다
      - name: 뉴스 수집 (50분 넘게 지났을 때만)
        continue-on-error: true
        run: |
          if python -c "import json,sys,datetime as d; u=json.load(open('data/news.json')).get('updated'); a=(d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(u)).total_seconds(); sys.exit(0 if a>3000 else 1)"; then
            timeout 600 python server.py --news
          else echo "뉴스는 최근 것"; fi
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "시세 수집 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
