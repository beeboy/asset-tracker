name: stats
# 종목별 전망 입력값(μ·σ·상관)을 web/model.js 와 같은 계산으로 하루 한 번 만들어 data/stats.json 에 저장한다.
# 아이폰 앱이 이 파일을 받아 3년 전망에 쓴다 (웹과 같은 종목 값). 미국 장 마감·샘플 계산 뒤에 돈다
on:
  schedule:
    - cron: "40 0 * * *"  # UTC 0시 40분 = 한국 9시 40분
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 전망 입력값 계산
        run: node tools/site_stats.mjs
      - name: 외부 요인 민감도·배당·환율 계산 (앱이 웹과 같은 숫자를 내도록)
        run: node tools/site_calc.mjs && node tools/check_calc.mjs
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/calc.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "전망 입력값 $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
