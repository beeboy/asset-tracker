name: usage
# Claude 사용량 위젯 앱(usage-app/, 본인용)이 컴파일되는지 확인한다. 맥과 같이 커밋된 ClaudeUsage.xcodeproj 를 그대로 빌드한다 (xcodegen 없음)
on:
  # 맥에서 빌드·확인하므로 push·PR(백업)에는 돌지 않는다. 필요할 때 Actions 에서 손으로 돌린다 (맥 러너 비용)
  workflow_dispatch:
concurrency:
  group: usage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 프로젝트 파일이 생성기와 같은지
        run: python3 usage-app/tools/gen_pbxproj.py && git diff --exit-code usage-app/ClaudeUsage.xcodeproj
      - name: 빌드 (시뮬레이터)
        run: |
          set -o pipefail
          cd usage-app && xcodebuild -project ClaudeUsage.xcodeproj -target ClaudeUsage -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|warning: .*(deprecated|never)|BUILD (SUCCEEDED|FAILED)|\*\* " | head -80
