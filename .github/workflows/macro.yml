name: macro
# 실러 데이터(금리·S&P500 이익)를 한 달에 한 번 받아 data/macro/ 에 저장한다.
on:
  schedule:
    - cron: "40 3 5 * *"   # 매달 5일
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  macro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 실러 데이터 수집
        run: |
          pip install -q xlrd
          python macro.py
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/macro/
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "거시 자료 수집 $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
