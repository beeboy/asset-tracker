name: ios
# 아이폰 앱(ios-app/, 위젯 확장 포함)이 컴파일되는지 확인한다 (서명 없이 시뮬레이터용). 실제 설치는 맥의 Xcode 에서
# 맥에서 쓰는 Xcode 26 과 맞춘다 (Xcode 16 은 일부 긴 식의 타입 추론이 시간 초과로 실패)
on:
  push:
    paths: ["ios-app/**", "data/prices/**", "web/model.js", "tools/site_stats.mjs", "tools/mc_parity.mjs", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios-app/**", "data/prices/**", "web/model.js", "tools/site_stats.mjs", "tools/mc_parity.mjs", ".github/workflows/ios.yml"]
  workflow_dispatch:
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && cd ios-app && xcodegen
      - name: 빌드 (시뮬레이터)
        run: |
          set -o pipefail
          xcodebuild -version
          cd ios-app && xcodebuild -project NaeiloApp.xcodeproj -target NaeiloApp -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|warning: .*(deprecated|never)|BUILD (SUCCEEDED|FAILED)|\*\* " | head -80
  # 전망 몬테카를로: 같은 입력에 웹(web/model.js)과 앱(MonteCarlo.swift)이 같은 결과를 내는지 (tools/mc_parity.mjs)
  parity:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 웹 계산
        run: node tools/mc_parity.mjs gen "$RUNNER_TEMP/par"
      - name: 앱 계산 (최적화 빌드)
        run: |
          swiftc -O ios-app/Naeilo/Data/MonteCarlo.swift ios-app/tools/mc_parity/main.swift -o "$RUNNER_TEMP/mc_parity"
          "$RUNNER_TEMP/mc_parity" "$RUNNER_TEMP/par"
      - name: 비교
        run: node tools/mc_parity.mjs cmp "$RUNNER_TEMP/par"
      - name: 시간 재기 (Xcode Debug 실행과 같은 최적화 없음)
        run: |
          swiftc -Onone ios-app/Naeilo/Data/MonteCarlo.swift ios-app/tools/mc_parity/main.swift -o "$RUNNER_TEMP/mc_parity_dbg"
          mkdir -p "$RUNNER_TEMP/dbg" && cp "$RUNNER_TEMP/par/input.json" "$RUNNER_TEMP/dbg/"
          "$RUNNER_TEMP/mc_parity_dbg" "$RUNNER_TEMP/dbg"
