# 허용 라이브러리: Compose, Glance, kotlinx.serialization, Play Billing, WorkManager (그 밖은 넣지 않는다)
[versions]
agp = "9.4.1"
kotlin = "2.2.10"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
serialization = "1.6.3"
glance = "1.1.1"
billing = "7.1.1"
work = "2.10.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
billing = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
