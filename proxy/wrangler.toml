# Worker 배포 설정 (.github/workflows/worker.yml 가 버튼으로 배포할 때 쓴다). 비밀값은 여기 두지 않는다 (Cloudflare 에 그대로 남는다)
name = "asset-ai"
main = "cloudflare-worker.js"
compatibility_date = "2025-01-01"
keep_vars = true   # 대시보드에서 넣은 일반 변수(REPO 등)를 지우지 않는다

[[kv_namespaces]]
binding = "VIEWS"
id = "__KV_VIEWS_ID__"   # 배포할 때 GitHub 저장소 변수 CF_KV_VIEWS_ID 로 바꾼다

[triggers]
# cron 하나 (15분). 여러 개를 두면 "*/30 13-22 * * 1-5" 만 불리고 나머지는 한 번도 안 불렸다 (2026-10-13).
# 수집 시간(평일 UTC 8~23시 + 다음날 0시대)과 알림 시각(미국 장중 :00/:30)은 코드가 고른다
crons = ["*/15 * * * *"]

# 결 PiP 방 (cloudflare-worker.js 15번). 무료 등급은 SQLite 방만 된다
[[durable_objects.bindings]]
name = "GYEOL"
class_name = "GyeolRoom"

[[migrations]]
tag = "gyeol-room-1"
new_sqlite_classes = ["GyeolRoom"]
