# Worker 배포 설정 (.github/workflows/worker.yml 가 버튼으로 배포할 때 쓴다). 비밀값은 여기 두지 않는다 (Cloudflare 에 그대로 남는다)
name = "asset-ai"
main = "cloudflare-worker.js"
compatibility_date = "2025-01-01"
keep_vars = true   # 대시보드에서 넣은 일반 변수(REPO 등)를 지우지 않는다

[[kv_namespaces]]
binding = "VIEWS"
id = "__KV_VIEWS_ID__"   # 배포할 때 GitHub 저장소 변수 CF_KV_VIEWS_ID 로 바꾼다

[triggers]
# 알림 검사 (미국 장중 30분) + 시세 수집 깨우기 15분 (한국 17시~다음날 09시대). "*/15 * * * *" 는 한 번도 불리지 않아서 분을 하나씩 적는다
# 같은 분에 두 cron 이 겹쳐도 수집은 10분 안 중복을 건너뛴다
crons = ["*/30 13-22 * * 1-5", "0,15,30,45 8-23 * * 1-5", "0,15 0 * * 2-6"]
