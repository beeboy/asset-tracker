<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>미션 목표 진행 시안</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15191E;text-decoration:none}a:hover{color:#2F6E62}
</style>
</helmet>
<div style="width: 468px; height: 1348px; box-sizing: border-box; padding: 24px; background: #E5E7EB; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: #15191E">
<div style="width: 420px; height: 1300px; box-sizing: border-box; background: #F2F3F5; padding: 28px 16px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">

<div style="display: flex; align-items: baseline; gap: 6px; padding: 0 4px 4px">
<span style="font-size: 22px; font-weight: 800">naeilo</span>
<span style="font-size: 22px; font-weight: 500; color: #4B5563">미션</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E4E7EB; border-radius: 14px; padding: 4px">
<button type="button" style="min-height: 44px; border: 0; border-radius: 11px; background: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; color: #15191E">목표 진행</button>
<button type="button" style="min-height: 44px; border: 0; border-radius: 11px; background: transparent; font: inherit; font-size: 16px; font-weight: 600; color: #4B5563">이번 주 예보</button>
</div>

<div style="background: #1B2431; border-radius: 22px; padding: 16px; color: #FFFFFF; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 700; color: #86D0BF">석 달 체크인</span><span style="font-size: 14px; font-weight: 700; color: #E8C15A">완료 ✓</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: #1E9A6A; border-radius: 12px; padding: 10px 0; text-align: center; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #D6F2E6">1달</span><span style="font-size: 15px; font-weight: 800">계획대로</span></div>
<div style="background: #1E9A6A; border-radius: 12px; padding: 10px 0; text-align: center; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #D6F2E6">2달</span><span style="font-size: 15px; font-weight: 800">계획대로</span></div>
<div style="background: #1E9A6A; border-radius: 12px; padding: 10px 0; text-align: center; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #D6F2E6">3달</span><span style="font-size: 15px; font-weight: 800">계획대로</span></div>
</div>
</div>

<a href="#" style="background: #E6F0ED; border: 1px solid #CFE3DD; border-radius: 16px; min-height: 48px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 700; color: #1F4D44">✓ 시작 미션 5/5<span aria-hidden="true">⌄</span></a>

<div style="background: #FFFFFF; border: 1px solid #E3E6EA; border-radius: 22px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 20px; font-weight: 800">10억까지 100칸</span><span style="font-size: 13px; color: #6B7280">1칸 = 1,000만</span></div>
<div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="100">
<sc-if value="{{c.mine}}" hint-placeholder-val="{{true}}"><span style="height: 30px; border-radius: 7px; background: #13685F"></span></sc-if>
<sc-if value="{{c.split}}" hint-placeholder-val="{{false}}"><span style="height: 30px; border-radius: 7px; background: linear-gradient(90deg, #13685F 0 20%, #90D0C0 20% 100%)"></span></sc-if>
<sc-if value="{{c.grown}}" hint-placeholder-val="{{false}}"><span style="height: 30px; border-radius: 7px; background: #90D0C0"></span></sc-if>
<sc-if value="{{c.empty}}" hint-placeholder-val="{{false}}"><span style="height: 30px; border-radius: 7px; background: #E6E8EB"></span></sc-if>
<sc-if value="{{c.goal}}" hint-placeholder-val="{{false}}"><span style="height: 30px; border-radius: 7px; box-sizing: border-box; border: 2px solid #E8C15A; background: #FFFFFF"></span></sc-if>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 15px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="display: flex; align-items: center; gap: 8px; color: #4B5563"><span style="width: 14px; height: 14px; border-radius: 4px; background: #13685F"></span>넣은 돈</span><span style="font-weight: 800">3억 9,201만</span></div>
<div style="display: flex; justify-content: space-between; align-items: center"><span style="display: flex; align-items: center; gap: 8px; color: #4B5563"><span style="width: 14px; height: 14px; border-radius: 4px; background: #90D0C0"></span>불어난 돈</span><span style="font-weight: 800">+9,800만</span></div>
<span style="display: flex; align-items: center; gap: 8px; color: #4B5563"><span style="width: 14px; height: 14px; border-radius: 4px; box-sizing: border-box; border: 2px solid #E8C15A"></span>마지막 칸 = 목표</span>
</div>
<div style="height: 1px; background: #EEF0F2"></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">어제보다 −951만</span><span style="font-size: 13px; color: #6B7280">하루 오르내림은 흔해요</span></div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="min-height: 52px; border-radius: 16px; border: 1px solid #E3E6EA; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15 V3 M7 8 L12 3 L17 8 M5 13 V20 H19 V13"></path></svg>25% 카드 공유</button>
<button type="button" style="min-height: 52px; border-radius: 16px; border: 1px solid #E3E6EA; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="18" viewBox="0 0 26 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 3 H19 C22 3 24 6 24 10 C24 15 22 17 20 17 C18 17 17 14 15 14 H11 C9 14 8 17 6 17 C4 17 2 15 2 10 C2 6 4 3 7 3 Z M7 8 V12 M5 10 H9"></path></svg>벽돌깨기</button>
</div>

<nav aria-label="아래 탭" style="margin-top: 4px; background: rgba(255,255,255,0.92); border: 1px solid #DADDE2; border-radius: 30px; padding: 8px 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: #15191E; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11 L12 3 L21 11 V21 H14 V15 H10 V21 H3 Z"></path></svg>홈</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: #15191E; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20 V12 M12 20 V7 M19 20 V4"></path></svg>종목</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: #15191E; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3 V21 H21 M6 16 L11 11 L14 14 L20 8"></path></svg>분석</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 22px; background: #E4E7EB; color: #2F6E62; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg>미션</a>
<a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: #15191E; font-size: 11px; font-weight: 700"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2.5 V5.5 M12 18.5 V21.5 M2.5 12 H5.5 M18.5 12 H21.5 M5.3 5.3 L7.4 7.4 M16.6 16.6 L18.7 18.7 M5.3 18.7 L7.4 16.6 M16.6 7.4 L18.7 5.3"></path></svg>설정</a>
</nav>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":468,"height":1348}}'>
class Component extends DCLogic {
renderVals() {
const cells = [];
for (let i = 0; i < 100; i++) {
cells.push({ mine: i < 39, split: i === 39, grown: i > 39 && i < 49, empty: i >= 49 && i < 99, goal: i === 99 });
}
return { cells: cells };
}
}
</script>
</body>
</html>
