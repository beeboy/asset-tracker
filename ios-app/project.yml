# naeilo 네이티브 앱 (XcodeGen). 맥에서:  brew install xcodegen && cd ios-app && xcodegen  → NaeiloApp.xcodeproj
# 위젯 앱(ios/)과는 별개 프로젝트. 시안(목업 49판)을 SwiftUI 로 옮긴 첫 빌드.
name: NaeiloApp
options:
  bundleIdPrefix: com.naeilo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Xcode 에서 고른 서명 팀 (xcodegen 을 다시 돌려도 유지)
    DEVELOPMENT_TEAM: 252W43H2KE
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NaeiloApp:
    type: application
    platform: iOS
    sources:
      - Naeilo
      # 테스트 시세: 사이트가 모으는 Yahoo 중계 자료 (3년 종가 + 현재가). 빌드할 때마다 저장소의 최신 파일이 들어간다
      - path: ../data/quotes.json
        buildPhase: resources
      - path: ../data/prices
        type: folder
        buildPhase: resources
    info:
      path: Naeilo/Info.plist
      properties:
        CFBundleDisplayName: naeilo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # 개발용 Tiingo 토큰 (계약 전이라 비워 둠). 출시 때는 naeilo 중계 서버를 거친다
        TIINGO_TOKEN: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
