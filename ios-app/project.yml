# naeilo 네이티브 앱 (XcodeGen). 맥에서:  brew install xcodegen && cd ios-app && xcodegen  → NaeiloApp.xcodeproj
# 위젯 앱(ios/)의 위젯을 합쳤다. 앱 + 위젯 확장 두 타깃.
name: NaeiloApp
options:
  bundleIdPrefix: com.naeilo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # TestFlight: 앱·위젯이 같은 버전·빌드 번호를 쓴다 (Info.plist 가 이 값을 읽음). 올릴 때마다 빌드 번호는 Xcode 업로드가 자동으로 올린다
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Xcode 에서 고른 서명 팀 (xcodegen 을 다시 돌려도 유지)
    DEVELOPMENT_TEAM: 252W43H2KE
    TARGETED_DEVICE_FAMILY: "1"
  configs:
    # Xcode Run(Debug)에서도 전망 몬테카를로가 1초 안에 끝나게 최적화 (최적화 없으면 50배 느림)
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  NaeiloApp:
    type: application
    platform: iOS
    sources:
      - path: Naeilo
        excludes: ["* 2.*", "**/* 2.*"]   # Finder 복사본(파일명 끝 " 2")은 빌드에서 뺀다
      # 위젯과 같이 쓰는 파일 (App Group 저장소, 위젯이 읽는 요약 형식)
      - path: WidgetShared
        excludes: ["* 2.*", "**/* 2.*"]   # Finder 복사본(파일명 끝 " 2")은 빌드에서 뺀다
      # 인물 위젯: 앱의 미리보기 화면에서도 같은 그림을 쓴다
      - Widgets/CharWidgets.swift
      - Widgets/Views/Catalog.swift
      - Widgets/Assets.xcassets
      # 테스트 시세: 사이트가 모으는 Yahoo 중계 자료 (3년 종가 + 현재가). 빌드할 때마다 저장소의 최신 파일이 들어간다
      - path: ../data/quotes.json
        buildPhase: resources
      # 종목별 전망 입력값 (사이트가 매일 만든다). 앱이 아직 받지 못했을 때 쓴다
      - path: ../data/stats.json
        buildPhase: resources
      # 외부 요인 민감도·배당·환율 자료 (사이트가 매일 웹과 같은 식으로 만든다). 앱이 아직 받지 못했을 때 쓴다
      - path: ../data/calc.json
        buildPhase: resources
      - path: ../data/prices
        type: folder
        buildPhase: resources
    info:
      path: Naeilo/Info.plist
      properties:
        CFBundleDisplayName: naeilo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.naeilo.widget
            CFBundleURLSchemes: [naeilo]
        UILaunchScreen: {}
        # 가로 화면도 지원 (아이폰은 거꾸로 세로 제외). 가로에서는 내용 폭을 720pt 로 묶고 고정 머리 없이 한 번에 스크롤
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # 개발용 Tiingo 토큰 (계약 전이라 비워 둠). 출시 때는 naeilo 중계 서버를 거친다
        TIINGO_TOKEN: ""
    # 위젯 앱(ios/)과 합친 앱: App Store Connect 의 기존 앱 기록·TestFlight 를 이어 쓰려고 번들 ID 를 그대로 쓴다
    entitlements:
      path: Naeilo/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.naeilo.widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.widget
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 설정의 앱 아이콘 바꾸기: 기본 내일의 별 + 인물 5
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-seri AppIcon-sio AppIcon-seonbae AppIcon-ir AppIcon-sua"
    dependencies:
      - target: NaeiloWidgets
    postBuildScripts:
      # 디버그 빌드마다 빌드 번호를 바꿔 iOS가 예전 위젯을 붙잡지 않게 한다
      - name: 빌드 번호
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          V=$(cat "$BUILT_PRODUCTS_DIR/.naeilo-build" 2>/dev/null || date +%y%m%d.%H%M%S)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
  NaeiloWidgets:
    type: app-extension
    platform: iOS
    postBuildScripts:
      # 앱 빌드 번호와 같게 맞추려고 값을 파일에 남긴다
      - name: 빌드 번호
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          V=$(date +%y%m%d.%H%M%S)
          echo "$V" > "$BUILT_PRODUCTS_DIR/.naeilo-build"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    sources:
      - path: Widgets
        excludes: ["* 2.*", "**/* 2.*"]   # Finder 복사본(파일명 끝 " 2")은 빌드에서 뺀다
      - path: WidgetShared
        excludes: ["* 2.*", "**/* 2.*"]   # Finder 복사본(파일명 끝 " 2")은 빌드에서 뺀다
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: naeilo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.naeilo.widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.widget.widgets
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXT"
