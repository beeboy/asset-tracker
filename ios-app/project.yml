# naeilo 네이티브 앱 (XcodeGen). 맥에서:  brew install xcodegen && cd ios-app && xcodegen  → NaeiloApp.xcodeproj
# 위젯 앱(ios/)의 위젯을 합쳤다. 앱 + 위젯 확장 두 타깃.
name: NaeiloApp
options:
  developmentLanguage: ko
  bundleIdPrefix: com.naeilo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    # TestFlight: 앱·위젯이 같은 버전·빌드 번호를 쓴다 (Info.plist 가 이 값을 읽음). 올릴 때마다 빌드 번호는 Xcode 업로드가 자동으로 올린다
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Xcode 에서 고른 서명 팀 (xcodegen 을 다시 돌려도 유지)
    DEVELOPMENT_TEAM: 252W43H2KE
    TARGETED_DEVICE_FAMILY: "1"
    # 배포 단계: internalBeta · publicBeta · release. 앱·위젯 Info.plist(NaeiloChannel)와 '시세 자료 넣기'가 이 값을 읽는다
    # 공개 베타·출시는 Yahoo·사이트 수집 자료를 넣지도 받지도 않고, 본인 키 시세와 가상 샘플(data/sample)만 쓴다
    NAEILO_CHANNEL: internalBeta
  configs:
    # Xcode Run(Debug)에서도 전망 몬테카를로가 1초 안에 끝나게 최적화 (최적화 없으면 50배 느림)
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  NaeiloApp:
    type: application
    platform: iOS
    sources:
      - path: Naeilo
        excludes: ["* 2.*", "**/* 2.*"]   # Finder 복사본(파일명 끝 " 2")은 빌드에서 뺀다
      # 위젯과 같이 쓰는 파일 (App Group 저장소, 위젯이 읽는 요약 형식)
      - path: WidgetShared
        excludes: ["* 2.*", "**/* 2.*"]   # Finder 복사본(파일명 끝 " 2")은 빌드에서 뺀다
      # 워치로 위젯 값 보내기 (WatchSync)
      - Watch/Shared
      # 인물 위젯: 앱의 미리보기 화면에서도 같은 그림을 쓴다
      - Widgets/CharWidgets.swift
      - Widgets/Views/Catalog.swift
      - Widgets/Assets.xcassets
      # 시세 자료(quotes·stats·calc·prices)는 아래 '시세 자료 넣기' 단계가 배포 단계에 맞춰 넣는다
    info:
      path: Naeilo/Info.plist
      properties:
        CFBundleLocalizations: [ko, en]
        CFBundleDisplayName: naeilo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NaeiloChannel: $(NAEILO_CHANNEL)
        CFBundleURLTypes:
          - CFBundleURLName: com.naeilo.widget
            CFBundleURLSchemes: [naeilo]
        UILaunchScreen: {}
        # 서울외국환중개 매매기준율은 http 로만 열린다 (https 인증서가 다른 이름) — 이 도메인만 허용
        NSAppTransportSecurity:
          NSExceptionDomains:
            smbs.biz:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        # 가로 화면도 지원 (아이폰은 거꾸로 세로 제외). 가로에서는 내용 폭을 720pt 로 묶고 고정 머리 없이 한 번에 스크롤
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # 동네 날씨: 대략적인 위치로 하루 한 번
        NSLocationWhenInUseUsageDescription: "동네 날씨를 내 지역 날씨로 보여 주려고 대략적인 위치를 써요."
        # 개발용 Tiingo 토큰 (계약 전이라 비워 둠). 출시 때는 naeilo 중계 서버를 거친다
        TIINGO_TOKEN: ""
    # 위젯 앱(ios/)과 합친 앱: App Store Connect 의 기존 앱 기록·TestFlight 를 이어 쓰려고 번들 ID 를 그대로 쓴다
    entitlements:
      path: Naeilo/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.naeilo.widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.widget
        # 개발자 모의투자(Naeilo/Mock/): 내부 베타에서만 MOCK 이 켜진다. 공개 베타·출시는 코드가 아예 들어가지 않는다
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) $(NAEILO_MOCK_$(NAEILO_CHANNEL))"
        NAEILO_MOCK_internalBeta: MOCK
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 설정의 앱 아이콘 바꾸기: 기본 내일의 별 + 인물 5
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-jump AppIcon-horizon AppIcon-tub AppIcon-dory AppIcon-pino AppIcon-mug AppIcon-bar"
    dependencies:
      - target: NaeiloWidgets
      - target: NaeiloWatch
    postCompileScripts:
      # 시세 자료 넣기: 내부 베타는 사이트가 Yahoo 로 모은 자료(data/), 공개 베타·출시는 가상 샘플(data/sample/)
      - name: 시세 자료 넣기
        basedOnDependencyAnalysis: false
        script: |
          D="$SRCROOT/../data"
          [ "$NAEILO_CHANNEL" = "internalBeta" ] || D="$D/sample"
          R="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          rm -rf "$R/prices" "$R/quotes.json" "$R/stats.json" "$R/calc.json"
          cp "$D/quotes.json" "$R/" && cp -R "$D/prices" "$R/prices" || exit 1
          for f in stats.json calc.json; do [ ! -f "$D/$f" ] || cp "$D/$f" "$R/"; done
    postBuildScripts:
      # 디버그 빌드마다 빌드 번호를 바꿔 iOS가 예전 위젯을 붙잡지 않게 한다
      - name: 빌드 번호
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          V=$(cat "$BUILT_PRODUCTS_DIR/.naeilo-build" 2>/dev/null || date +%y%m%d.%H%M%S)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          # 워치 앱·워치 위젯도 같은 빌드 번호로 (다르면 워치가 설치를 거부한다). 바꾼 뒤 안쪽부터 다시 서명
          W="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Watch/NaeiloWatch.app"
          [ -d "$W" ] || exit 0
          for P in "$W/PlugIns/NaeiloWatchWidgets.appex" "$W"; do
            [ -d "$P" ] || continue
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" "$P/Info.plist"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" --preserve-metadata=identifier,entitlements,flags --timestamp=none "$P" || exit 1
          done
  NaeiloWidgets:
    type: app-extension
    platform: iOS
    postBuildScripts:
      # 앱 빌드 번호와 같게 맞추려고 값을 파일에 남긴다
      - name: 빌드 번호
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          V=$(date +%y%m%d.%H%M%S)
          echo "$V" > "$BUILT_PRODUCTS_DIR/.naeilo-build"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $V" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    sources:
      - path: Widgets
      # 앱과 같은 번역 목록 (위젯 공용 코드의 String(localized:))
      - path: Naeilo/Localizable.xcstrings
        buildPhase: resources
        excludes: ["* 2.*", "**/* 2.*"]   # Finder 복사본(파일명 끝 " 2")은 빌드에서 뺀다
      - path: WidgetShared
        excludes: ["* 2.*", "**/* 2.*"]   # Finder 복사본(파일명 끝 " 2")은 빌드에서 뺀다
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: naeilo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NaeiloChannel: $(NAEILO_CHANNEL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.naeilo.widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.widget.widgets
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXT"
  # 워치 앱: 아이폰이 보낸 위젯 값을 받아 App Group 에 쓴다 (스마트 스택 위젯용)
  NaeiloWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [Watch/Shared, Watch/App]
    info:
      path: Watch/App-Info.plist
    entitlements:
      path: Watch/Watch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.widget.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: NaeiloWatchWidgets
  # 워치 스마트 스택 위젯 3개
  NaeiloWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch/Shared
      - Watch/Widgets
      - Widgets/Assets.xcassets
    info:
      path: Watch/Widgets-Info.plist
    entitlements:
      path: Watch/Watch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.widget.watchkitapp.widgets
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WATCH_WIDGET"
