# naeilo 네이티브 앱 (XcodeGen). 맥에서:  brew install xcodegen && cd ios-app && xcodegen  → NaeiloApp.xcodeproj
# 위젯 앱(ios/)과는 별개 프로젝트. 시안(목업 49판)을 SwiftUI 로 옮긴 첫 빌드.
name: NaeiloApp
options:
  bundleIdPrefix: com.naeilo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NaeiloApp:
    type: application
    platform: iOS
    sources:
      - Naeilo
    info:
      path: Naeilo/Info.plist
      properties:
        CFBundleDisplayName: naeilo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
