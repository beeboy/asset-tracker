# 아이폰 위젯 앱 (XcodeGen). 맥에서:  brew install xcodegen && cd ios && xcodegen  → Naeilo.xcodeproj
name: Naeilo
options:
  bundleIdPrefix: com.naeilo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Xcode 의 '권장 설정으로 업데이트' 안내를 띄우지 않는다
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Naeilo:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # 위젯 화면은 앱의 '위젯' 탭 미리보기에도 쓴다
      - Widgets/Views
      # 사이트와 같은 계산 파일을 앱에 넣는다 (앱은 사이트에서 더 새 파일을 받으면 그것을 쓴다)
      - path: ../web/model.js
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: naeilo 위젯
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        # TestFlight 업로드 때 수출 규정(암호화) 질문을 건너뛴다: 표준 HTTPS·키체인만 씀
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [fetch, processing]
        CFBundleURLTypes:
          - CFBundleURLName: com.naeilo.widget
            CFBundleURLSchemes: [naeilo]
        BGTaskSchedulerPermittedIdentifiers: [com.naeilo.widget.refresh, com.naeilo.widget.compute]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.naeilo.widget]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.naeilo.widget.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.widget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: NaeiloWidgets
  NaeiloWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: naeilo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.naeilo.widget]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.naeilo.widget.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.widget.widgets
        # 위젯 버튼(↻, 금액 숨기기) 동작은 위젯에만 둔다. 앱에도 있으면 iOS 가 앱 쪽에서 돌려 위젯에 반영이 안 될 수 있다
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXT"
