# 아이폰 위젯 앱 (XcodeGen). 맥에서:  brew install xcodegen && cd ios && xcodegen  → Naeilo.xcodeproj
name: Naeilo
options:
  bundleIdPrefix: com.naeilo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Naeilo:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # 사이트와 같은 계산 파일을 앱에 넣는다 (앱은 사이트에서 더 새 파일을 받으면 그것을 쓴다)
      - path: ../web/model.js
        buildPhase: resources
      - path: ../web/widget-core.js
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: naeilo 위젯
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.naeilo.widget.refresh, com.naeilo.widget.compute]
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.com.naeilo.widget]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.naeilo.widget.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.widget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: NaeiloWidgets
  NaeiloWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: naeilo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.naeilo.widget]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.naeilo.widget.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naeilo.widget.widgets
